services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: surgery_schedule
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - planner-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d surgery_schedule"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_URL: postgres://planner:${POSTGRES_PASSWORD}@db:5432/surgery_schedule
      APP_SECRET: ${APP_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
      USER_STORE_PATH: ${USER_STORE_PATH:-/data/users.json}
      WIKI_FILE_STORE_PATH: ${WIKI_FILE_STORE_PATH:-/data/wiki-files}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      VIEWER_API_KEY: ${VIEWER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-openai}
      OPENAI_PRIMARY_MODEL: ${OPENAI_PRIMARY_MODEL:-gpt-5.6-luna}
      OPENAI_FALLBACK_MODELS: ${OPENAI_FALLBACK_MODELS:-gpt-5.6-terra}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CHAT_SETTINGS_PATH: ${CHAT_SETTINGS_PATH:-/data/chat-settings.json}
      OPENROUTER_PRIMARY_MODEL: ${OPENROUTER_PRIMARY_MODEL:-deepseek/deepseek-v4-flash}
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-google/gemma-3-27b-it}
      OPENROUTER_TRANSCRIPTION_MODEL: ${OPENROUTER_TRANSCRIPTION_MODEL:-nvidia/parakeet-tdt-0.6b-v3}
      OPENROUTER_VOICE_MODEL: ${OPENROUTER_VOICE_MODEL:-fish-audio/s2.1-pro-free:free}
      OPENROUTER_VOICE_NAME: ${OPENROUTER_VOICE_NAME:-David Attenborough Dramatic}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_multilingual_v2}
      ELEVENLABS_VOICE_IDS: ${ELEVENLABS_VOICE_IDS:-kSvMZug5ZFM9sKGpLAei,dWAnId3mzfl4fTszwtOG,0rEo3eAjssGDUCXHYENf,onwK4e9ZLuTAKqWW03F9,ia2hmHnWgMXcUgmY4yVU}
      CHAT_QUOTA_TIME_ZONE: ${CHAT_QUOTA_TIME_ZONE:-America/New_York}
      QGENDA_SYNC_ENABLED: ${QGENDA_SYNC_ENABLED:-true}
      QGENDA_PUBLIC_LINK_URL: ${QGENDA_PUBLIC_LINK_URL:-}
      QGENDA_SYNC_TIME_ZONE: ${QGENDA_SYNC_TIME_ZONE:-America/New_York}
      QGENDA_SYNC_MONTHS_PAST: ${QGENDA_SYNC_MONTHS_PAST:-1}
      QGENDA_SYNC_MONTHS_FUTURE: ${QGENDA_SYNC_MONTHS_FUTURE:-3}
      QGENDA_SYNC_ON_START: ${QGENDA_SYNC_ON_START:-true}
      QGENDA_PUBLIC_TASK_MAP_JSON: ${QGENDA_PUBLIC_TASK_MAP_JSON:-}
      QGENDA_PUBLIC_STAFF_MAP_JSON: ${QGENDA_PUBLIC_STAFF_MAP_JSON:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    volumes:
      - planner-users:/data
    expose:
      - "8787"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8787/api/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  planner-db:
  planner-users:
  caddy-data:
  caddy-config:
